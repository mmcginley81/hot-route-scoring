name: Reset weekly scores

# Runs Wednesday afternoon Pacific, safely after the Wednesday-noon-Pacific
# week turnover (see live_poll.week_turnover()) so reset_week.py's own
# auto-compute (current week - 1) lands on the week that just ended.
# GitHub Actions cron is UTC-only and can't express "1pm Pacific" directly,
# so — same fix live_poll.yml/update_total_score.yml use for their own
# schedules — two cron lines cover both DST offsets:
#   - 20:00 UTC = 1:00pm PDT (weeks 1-7, before Nov 1 DST change)
#   - 21:00 UTC = 1:00pm PST (week 8 onward)
# Whichever one doesn't match Pacific 1pm for a given week is a no-op:
# reset_week.py's classify_players() just finds nothing left to append for
# an already-closed-out week.
on:
  schedule:
    - cron: '0 20 * * 3'
    - cron: '0 21 * * 3'
  workflow_dispatch:
    inputs:
      week:
        description: "the NFL week to close out (defaults to auto-computed from today's date if left blank)"
        required: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m hotroute.reset_week --live ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }}
        env:
          PYTHONPATH: src
          BUBBLE_APP_URL: ${{ secrets.BUBBLE_APP_URL }}
          BUBBLE_API_TOKEN: ${{ secrets.BUBBLE_API_TOKEN }}
