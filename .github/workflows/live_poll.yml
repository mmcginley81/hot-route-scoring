name: Live scoring poll

on:
  # Deliberately generous — casts a wide net rather than trying to match
  # exact kickoff times per week. Diff-based writes in live_poll.py mean an
  # empty poll (nothing changed) costs almost nothing in Bubble WU, so it's
  # cheaper to over-poll than to maintain a precise, DST-aware schedule.
  #
  # Covers ~6:00am-10:30pm Pacific, every 30 min, Wed-Mon (the only day with
  # zero NFL games across weeks 1-9 is Tuesday). Written as two blocks
  # because the evening portion of each local day rolls past midnight UTC:
  #   - block 1: 13:00-23:30 UTC same day
  #   - block 2: 00:00-06:30 UTC the next day (the rollover)
  # The UTC hours are widened by an extra hour on each side to cover both
  # PDT (UTC-7, weeks 1-7) and PST (UTC-8, week 8 onward after Nov 1 DST
  # change) without needing separate schedules for each.
  schedule:
    - cron: '0,30 13-23 * * 1,3,4,5,6,0'
    - cron: '0,30 0-6 * * 1,2,4,5,6,0'
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week (defaults to auto-computed from today's date if left blank)"
        required: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m hotroute.live_poll --live ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }}
        env:
          MFL_LEAGUE_ID: ${{ secrets.MFL_LEAGUE_ID }}
          MFL_YEAR: ${{ secrets.MFL_YEAR }}
          MFL_HOST: ${{ secrets.MFL_HOST }}
          BUBBLE_APP_URL: ${{ secrets.BUBBLE_APP_URL }}
          BUBBLE_API_TOKEN: ${{ secrets.BUBBLE_API_TOKEN }}
