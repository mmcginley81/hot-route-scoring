name: Update matchup status

# On-demand only, same as reset_week.yml — nothing schedules this yet.
# Trigger manually from the Actions tab shortly after each week's
# Wednesday-noon-Pacific turnover (see live_poll.week_turnover()) so
# Matchup.matchup_status flips upcoming -> live -> completed on time.
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m hotroute.update_matchup_status --live
        env:
          PYTHONPATH: src
          BUBBLE_APP_URL: ${{ secrets.BUBBLE_APP_URL }}
          BUBBLE_API_TOKEN: ${{ secrets.BUBBLE_API_TOKEN }}
