name: Update matchup status

# Runs 15 min after reset_week.yml's own Wednesday-afternoon-Pacific
# schedule — no real dependency between the two (this only touches
# Matchup, reset_week.py only touches NFLPlayer/TeamPlayer), the stagger
# is just to keep their runs from overlapping. Same DST-safe two-cron-line
# pattern as reset_week.yml:
#   - 20:15 UTC = 1:15pm PDT (weeks 1-7, before Nov 1 DST change)
#   - 21:15 UTC = 1:15pm PST (week 8 onward)
on:
  schedule:
    - cron: '15 20 * * 3'
    - cron: '15 21 * * 3'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m hotroute.update_matchup_status --live
        env:
          PYTHONPATH: src
          BUBBLE_APP_URL: ${{ secrets.BUBBLE_APP_URL }}
          BUBBLE_API_TOKEN: ${{ secrets.BUBBLE_API_TOKEN }}
