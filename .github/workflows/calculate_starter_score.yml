name: Calculate starter score

# No schedule trigger — live_poll.py now triggers this same Bubble workflow
# itself, scoped to only the matchups with an actual score change on each
# poll (see live_poll.py's STARTER_SCORE_WORKFLOW block). Running this on
# its own 5-min schedule too meant firing the workflow for every live
# matchup unconditionally on every poll, which was the dominant Workflow
# Unit cost in the whole pipeline. Kept as workflow_dispatch-only now: a
# manual full-sweep safety net (e.g. if a Bubble edit or a bug in
# live_poll's diff logic left a matchup's starter score stale).
on:
  workflow_dispatch:

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m hotroute.calculate_starter_score --live
        env:
          PYTHONPATH: src
          MFL_LEAGUE_ID: ${{ secrets.MFL_LEAGUE_ID }}
          BUBBLE_APP_URL: ${{ secrets.BUBBLE_APP_URL }}
          BUBBLE_API_TOKEN: ${{ secrets.BUBBLE_API_TOKEN }}
