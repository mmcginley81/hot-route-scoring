name: Calculate starter score

on:
  # Every 5 min, Wed 12pm through Mon 11:30pm Pacific, skipping Tuesday
  # entirely. Same widen-by-an-hour approach as live_poll.yml: boundaries
  # are padded ~1hr on each side to cover both PDT (UTC-7) and PST (UTC-8)
  # without maintaining separate DST-aware schedules.
  #   - block 1: Wed 18:00-23:59 UTC — start of window (~Wed 10-11am Pacific)
  #   - block 2: Thu-Mon, all day UTC — full local days, no partial edges
  #   - block 3: Tue 00:00-08:59 UTC — tail end of Monday night Pacific
  # Net effect: nothing runs from ~Tue 9am Pacific through Wed 11am Pacific.
  schedule:
    - cron: '*/5 18-23 * * 3'
    - cron: '*/5 * * * 1,4,5,6,0'
    - cron: '*/5 0-8 * * 2'
  workflow_dispatch:

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m hotroute.calculate_starter_score --live
        env:
          PYTHONPATH: src
          MFL_LEAGUE_ID: ${{ secrets.MFL_LEAGUE_ID }}
          BUBBLE_APP_URL: ${{ secrets.BUBBLE_APP_URL }}
          BUBBLE_API_TOKEN: ${{ secrets.BUBBLE_API_TOKEN }}
